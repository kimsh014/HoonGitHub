<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="490" y="28.0" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">천장 TV를 손봐야 할 때: 사다리는 맨 마지막</text><rect x="340" y="60" width="300" height="60" rx="10" fill="#f3f4f6" stroke="#1f2328" stroke-width="2"/><text x="490.0" y="80.2" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">TV가 TV 관리 화면 목록에</text><text x="490.0" y="99.8" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">"연결됨"으로 보이나요?</text><polyline points="490,120 490,150 200,150 200,178" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#a-green)"/><text x="340" y="138.0" font-size="14" fill="#1a7f37" font-weight="bold" text-anchor="middle" dominant-baseline="central">예</text><rect x="40" y="180" width="320" height="150" rx="10" fill="#f6fff8" stroke="#1a7f37" stroke-width="2"/><text x="200" y="205.0" font-size="17" fill="#1a7f37" font-weight="bold" text-anchor="middle" dominant-baseline="central">① POS기에서 바로</text><text x="60" y="244.7" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">devices.html 에서</text><text x="60" y="262.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">화면 번호·배율·방향·밝기·서버 주소</text><text x="60" y="281.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">지금 화면 보기 · 앱 다시 켜기</text><text x="60" y="299.3" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">A/S 연결(adb) 열기</text><polyline points="640,90 780,90 780,178" fill="none" stroke="#c8102e" stroke-width="2.5" marker-end="url(#a-red)"/><text x="720" y="76.0" font-size="14" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">아니오</text><rect x="620" y="180" width="320" height="150" rx="10" fill="#fff5f5" stroke="#c8102e" stroke-width="2"/><text x="780" y="205.0" font-size="17" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">② USB 메모리 꽂기</text><text x="640" y="244.7" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">devices.html 에서 menuboard.txt 받기</text><text x="640" y="262.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">USB 맨 위에 저장 → TV 보드에 꽂기</text><text x="640" y="281.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">몇 초 안에 적용, 화면 아래 결과 표시</text><text x="640" y="299.3" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">(보드 USB 단자가 손 닿는 곳일 때)</text><polyline points="780,330 780,370 650,370" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><text x="740" y="356.0" font-size="14" fill="#6e7781" font-weight="bold" text-anchor="middle" dominant-baseline="central">안 되면</text><rect x="330" y="350" width="320" height="90" rx="10" fill="#fffbe6" stroke="#bf8700" stroke-width="2"/><text x="490" y="372.0" font-size="17" fill="#bf8700" font-weight="bold" text-anchor="middle" dominant-baseline="central">③ 리모컨 · 마지막에 사다리</text><text x="490" y="403.6" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">메뉴판에서 리모컨 확인 버튼 2초 → 설정 화면</text><text x="490" y="420.4" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">그래도 안 되면 사다리 + USB 연결로 다시 설치</text></svg>
