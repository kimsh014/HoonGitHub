 fill="none" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a-dark)"/><text x="860" y="160.0" font-size="14" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">천장 TV (0.5초 안)</text><circle cx="788" cy="175" r="16" fill="#c8102e"/><text x="788" y="175.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text><rect x="270" y="370" width="290" height="70" rx="10" fill="#f0f7ff" stroke="#0969da" stroke-width="2"/><text x="415.0" y="395.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">사장님: POS기 화면이나 휴대폰으로</text><text x="415.0" y="414.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">메뉴·사진·가격·품절 고치기</text><polyline points="415,370 415,322" fill="none" stroke="#0969da" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="520" y="345.0" font-size="14" fill="#0969da" font-weight="bold" text-anchor="middle" dominant-baseline="central">저장하면 TV에 바로</text><text x="860" y="430.0" font-size="13" fill="#6e7781" font-weight="normal" text-anchor="middle" dominant-baseline="central">부른 번호는 10분 뒤 저절로 빠집니다</text></svg>
