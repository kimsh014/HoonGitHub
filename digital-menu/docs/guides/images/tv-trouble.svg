<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="490" y="28.0" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">TV에 메뉴판이 안 나올 때 차례대로</text><rect x="330" y="55" width="320" height="50" rx="10" fill="#f3f4f6" stroke="#1f2328" stroke-width="2"/><text x="490.0" y="80.0" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">TV 화면에 무엇이 보이나요?</text><rect x="40" y="130" width="270" height="68" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="175.0" y="164.0" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">검은 화면·방송 화면</text><polyline points="312,164 358,164" fill="none" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a-dark)"/><rect x="360" y="130" width="580" height="68" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="380" y="154.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">리모컨으로 입력(HDMI)을 메뉴판 보드 쪽으로.</text><text x="380" y="173.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">TV 전원·HDMI 선 확인.</text><rect x="40" y="214" width="270" height="68" rx="10" fill="#fff" stroke="#c8102e" stroke-width="2"/><text x="175.0" y="238.2" font-size="15" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">"서버를 찾지 못했습니다"</text><text x="175.0" y="257.8" font-size="15" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">설정 화면</text><polyline points="312,248 358,248" fill="none" stroke="#c8102e" stroke-width="2.5" marker-end="url(#a-red)"/><rect x="360" y="214" width="580" height="68" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="380" y="238.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">POS기가 켜져 있나? → POS기에서 127.0.0.1:8090/?screen=1 열기</text><text x="380" y="257.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">같은 공유기인가? 손님 와이파이에 붙지 않았나?</text><rect x="40" y="298" width="270" height="68" rx="10" fill="#fff" stroke="#bf8700" stroke-width="2"/><text x="175.0" y="332.0" font-size="15" fill="#bf8700" font-weight="bold" text-anchor="middle" dominant-baseline="central">매장 이름만 크게</text><polyline points="312,332 358,332" fill="none" stroke="#bf8700" stroke-width="2.5" marker-end="url(#a-amber)"/><rect x="360" y="298" width="580" height="68" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="380" y="322.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">TV가 없는 화면 번호를 띄우는 중.</text><text x="380" y="341.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">수정 화면 "화면 구성"의 경고를 보고 번호를 맞춤</text><rect x="40" y="382" width="270" height="68" rx="10" fill="#fff" stroke="#0969da" stroke-width="2"/><text x="175.0" y="416.0" font-size="15" fill="#0969da" font-weight="bold" text-anchor="middle" dominant-baseline="central">메뉴는 나오는데 옛 메뉴</text><polyline points="312,416 358,416" fill="none" stroke="#0969da" stroke-width="2.5" marker-end="url(#a-blue)"/><rect x="360" y="382" width="580" height="68" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="380" y="406.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">끊겨서 마지막 저장 화면을 띄우는 중(최대 10분 전 모습).</text><text x="380" y="425.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">POS기 서버·공유기 확인, 붙으면 저절로 새로 고침</text><rect x="40" y="466" width="270" height="68" rx="10" fill="#fff" stroke="#6e7781" stroke-width="2"/><text x="175.0" y="500.0" font-size="15" fill="#6e7781" font-weight="bold" text-anchor="middle" dominant-baseline="central">설정 화면이 떠 있음</text><polyline points="312,500 358,500" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="360" y="466" width="580" height="68" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="380" y="490.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">누가 리모컨 확인을 2초 누름.</text><text x="380" y="509.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" dominant-baseline="central">2분 지나면 저절로 메뉴판으로 돌아감</text><polyline points="490,105 490,118 175,118 175,128" fill="none" stroke="#6e7781" stroke-width="2"/></svg>
