<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="490" y="28.0" font-size="21" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">매장 네트워크: TV와 POS기는 같은 공유기, 손님은 게스트 와이파이</text><rect x="400" y="60" width="180" height="50" rx="10" fill="#f3f4f6" stroke="#6e7781" stroke-width="2"/><text x="490.0" y="85.0" font-size="16" fill="#6e7781" font-weight="normal" text-anchor="middle" dominant-baseline="central">인터넷</text><rect x="390" y="160" width="200" height="70" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="490.0" y="184.6" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">공유기</text><text x="490.0" y="205.4" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">(ipTIME 등)</text><polyline points="490,110 490,158" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="30" y="280" width="600" height="210" rx="10" fill="#f6fff8" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 5"/><text x="330" y="470.0" font-size="15" fill="#1a7f37" font-weight="bold" text-anchor="middle" dominant-baseline="central">매장망 (같은 공유기 안)</text><rect x="60" y="330" width="170" height="100" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="145.0" y="359.2" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">POS기</text><text x="145.0" y="380.0" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">주소 고정</text><text x="145.0" y="400.8" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">192.168.0.10</text><text x="145" y="445.0" font-size="12" fill="#1a7f37" font-weight="normal" text-anchor="middle" dominant-baseline="central">방화벽 8090: 같은 공유기만</text><rect x="270" y="335" width="150" height="86" rx="6" fill="#111" stroke="#111" stroke-width="2"/><rect x="278" y="343" width="134" height="70" rx="3" fill="#2b2f36" stroke="#2b2f36" stroke-width="2"/><text x="345.0" y="378.0" font-size="15" fill="#fff" font-weight="normal" text-anchor="middle" dominant-baseline="central">TV 1</text><rect x="450" y="335" width="150" height="86" rx="6" fill="#111" stroke="#111" stroke-width="2"/><rect x="458" y="343" width="134" height="70" rx="3" fill="#2b2f36" stroke="#2b2f36" stroke-width="2"/><text x="525.0" y="378.0" font-size="15" fill="#fff" font-weight="normal" text-anchor="middle" dominant-baseline="central">TV 2</text><text x="345" y="440.0" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="middle" dominant-baseline="central">랜선 권장</text><text x="525" y="440.0" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="middle" dominant-baseline="central">와이파이면 매장용에</text><polyline points="450,230 145,328" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#a-green)"/><polyline points="480,230 345,333" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#a-green)"/><polyline points="510,230 525,333" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#a-green)"/><rect x="670" y="280" width="280" height="210" rx="10" fill="#fff5f5" stroke="#c8102e" stroke-width="2" stroke-dasharray="6 5"/><text x="810" y="470.0" font-size="15" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">게스트 와이파이 (손님용)</text><rect x="735" y="340" width="150" height="70" rx="10" fill="#fff" stroke="#c8102e" stroke-width="2"/><text x="810.0" y="375.0" font-size="16" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">손님 휴대폰</text><polyline points="560,230 805,338" fill="none" stroke="#c8102e" stroke-width="2.5" marker-end="url(#a-red)"/><text x="810" y="430.0" font-size="13" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">메뉴판 서버에 못 들어옴</text><line x1="640" y1="360" x2="700" y2="420" stroke="#c8102e" stroke-width="5"/><line x1="700" y1="360" x2="640" y2="420" stroke="#c8102e" stroke-width="5"/><rect x="620" y="160" width="330" height="70" rx="10" fill="#fffbe6" stroke="#bf8700" stroke-width="2"/><text x="785.0" y="186.6" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">공유기에 "바꾸기 전 A/S 문의" 스티커</text><text x="785.0" y="203.4" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">공유기를 바꾸면 주소 예약이 사라짐</text></svg>
