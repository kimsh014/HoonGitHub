ine="central">POS기·TV 전원을 켜면</text><text x="115" y="214.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">메뉴판이 저절로 뜹니다</text><polyline points="201,165 219,165" fill="none" stroke="#6e7781" stroke-width="2" marker-end="url(#a-gray)"/><rect x="220" y="60" width="170" height="210" rx="10" fill="#fff" stroke="#bf8700" stroke-width="2.5"/><rect x="220" y="60" width="170" height="40" rx="10" fill="#bf8700"/><rect x="220" y="85" width="170" height="15" fill="#bf8700"/><text x="305" y="80.0" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">영업 전</text><text x="305" y="135.0" font-size="17" fill="#bf8700" font-weight="bold" text-anchor="middle" dominant-baseline="central">품절 확인</text><text x="305" y="195.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">수정 화면 맨 위</text><text x="305" y="214.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">"지금 품절" 보고 풀기</text><polyline points="391,165 409,165" fill="none" stroke="#6e7781" stroke-width="2" marker-end="url(#a-gray)"/><rect x="410" y="60" width="170" height="210" rx="10" fill="#fff" stroke="#1a7f37" stroke-width="2.5"/><rect x="410" y="60" width="170" height="40" rx="10" fill="#1a7f37"/><rect x="410" y="85" width="170" height="15" fill="#1a7f37"/><text x="495" y="80.0" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">영업 중</text><text x="495" y="135.0" font-size="17" fill="#1a7f37" font-weight="bold" text-anchor="middle" dominant-baseline="central">번호 부르기</text><text x="495" y="195.9" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">번호 + Enter</text><text x="495" y="214.1" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle" dominant-baseline="central">잘못 불렀으면 빼기</text><polyline points="581,165 599,165" fill="none" 