<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="490" y="28.0" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" dominant-baseline="central">설치 순서 한눈에 (위에서 아래, 왼쪽에서 오른쪽)</text><rect x="40" y="60" width="270" height="82" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="70" cy="101" r="18" fill="#c8102e"/><text x="70" y="101.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text><text x="100" y="90.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">POS기에 서버 설치</text><text x="100" y="116.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">install-server.bat · 20분</text><polyline points="312,101 358,101" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="360" y="60" width="270" height="82" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="390" cy="101" r="18" fill="#c8102e"/><text x="390" y="101.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text><text x="420" y="90.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">POS기 주소 고정</text><text x="420" y="116.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">공유기 DHCP 예약 · 5분</text><polyline points="632,101 678,101" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="680" y="60" width="270" height="82" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="710" cy="101" r="18" fill="#c8102e"/><text x="710" y="101.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text><text x="740" y="90.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">정전 뒤 자동 켜짐</text><text x="740" y="116.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">BIOS 설정 · 5분</text><rect x="40" y="170" width="270" height="82" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="70" cy="211" r="18" fill="#c8102e"/><text x="70" y="211.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text><text x="100" y="200.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">TV 앱 설치</text><text x="100" y="226.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">바닥에서, USB 연결 · 10분</text><polyline points="312,211 358,211" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="360" y="170" width="270" height="82" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="390" cy="211" r="18" fill="#c8102e"/><text x="390" y="211.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text><text x="420" y="200.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">화면 번호·방향 맞추기</text><text x="420" y="226.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">라벨 붙이기 · 5분</text><polyline points="632,211 678,211" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="680" y="170" width="270" height="82" rx="10" fill="#fff5f5" stroke="#c8102e" stroke-width="2"/><circle cx="710" cy="211" r="18" fill="#c8102e"/><text x="710" y="211.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">6</text><text x="740" y="200.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">TV 천장에 달기</text><text x="740" y="226.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">랜선·전원 정리</text><rect x="40" y="280" width="270" height="82" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="70" cy="321" r="18" fill="#c8102e"/><text x="70" y="321.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">7</text><text x="100" y="310.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">POS기에서 TV 확인</text><text x="100" y="336.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">devices.html · 5분</text><polyline points="312,321 358,321" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="360" y="280" width="270" height="82" rx="10" fill="#f6f8fa" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 5"/><circle cx="390" cy="321" r="18" fill="#6e7781"/><text x="390" y="321.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">8</text><text x="420" y="310.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">번호 키패드 설치</text><text x="420" y="336.0" font-size="14" fill="#bf8700" font-weight="bold" text-anchor="start" dominant-baseline="central">준비 중</text><polyline points="632,321 678,321" fill="none" stroke="#6e7781" stroke-width="2.5" marker-end="url(#a-gray)"/><rect x="680" y="280" width="270" height="82" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="710" cy="321" r="18" fill="#c8102e"/><text x="710" y="321.0" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" dominant-baseline="central">9</text><text x="740" y="310.0" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" dominant-baseline="central">사장님께 인계</text><text x="740" y="336.0" font-size="14" fill="#6e7781" font-weight="normal" text-anchor="start" dominant-baseline="central">설명서·스티커 · 10분</text><text x="490" y="385.0" font-size="15" fill="#c8102e" font-weight="bold" text-anchor="middle" dominant-baseline="central">5번까지 바닥에서 끝내고 6번에서 천장에 답니다. 달고 나면 7번부터는 사다리 없이 POS기에서 합니다.</text></svg>
