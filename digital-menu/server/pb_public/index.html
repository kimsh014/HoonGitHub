<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><!-- 보드 앱 WebView가 1080p·4K 어디서나 화면 너비(vw)에 맞게 그리도록 -->
<title>메뉴판</title>
<style>
/* 메뉴판 화면 (TV용). renderBoard(board, screenNo) 하나만 정의하고, 데이터 받기·갱신은 board.js가 한다.
   화면 종류: grid(사진 격자) · list(목록 + 큰 사진) · promo(홍보) · calls(번호 전용), callBand가 켜지면 아래에 번호 띠.
   크기: 1rem = 화면 긴 변의 1.5% × 글자 배율(--zoom, board.js가 넣음). 그래서 1920×1080, 3840×2160,
   세로 1080×1920에서 같은 비율로 보인다. 본문(#main) 안은 em으로 잡아, 메뉴가 많거나 배율이 커서
   넘칠 때만 renderBoard가 --fit을 조금씩 줄여 잘리지 않게 맞춘다.

   역할 나눔: 이 파일의 배치(레이아웃·크기·넘침·품절·4K·세로)는 개발팀, 색·글꼴·모양은 UI팀의 테마 파일
   (themes/<이름>.css)이 아래 "테마 값"만 바꿔서 정한다. 테마 만드는 법은 docs/themes/README.md. */
:root{
  /* renderBoard가 넣는 값. 테마에서 바꾸지 않는다 */
  --brand:#c8102e;           /* 매장 브랜드 색 (사장님이 고름) */
  --on-brand:#fff;           /* 브랜드 색 위 글자: 브랜드 색 밝기를 보고 흰색·검은색 중 잘 보이는 쪽 */

  /* ── 테마 값: themes/*.css는 이 블록의 변수만 바꾼다 (기본값 = 테마 없음) ── */
  --font:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
  --weight:700;              /* 보드(안드로이드)에 기본으로 있는 굵기는 400과 700뿐 */
  --ink:#fff;                /* 기본 글자 */
  --muted:rgba(255,255,255,.72); /* 보조 글자(안내, 이름표) */
  --base:#0b0b0d;            /* 바탕색 */
  --veil:linear-gradient(rgba(8,8,10,.5),rgba(8,8,10,.78)); /* 매장 배경 사진 위에 덮는 막 (글이 잘 보이게) */
  --glow:linear-gradient(160deg,var(--brand),transparent 50%); /* 막 위의 빛·무늬 (background 값) */
  --glow-opacity:.3;
  --panel:rgba(12,12,14,.74); /* 카드·목록 상자 바탕 */
  --line:rgba(255,255,255,.16);
  --radius:.8em;             /* 카드·상자 모서리 */
  --card-border:.06em solid var(--line);
  --card-shadow:none;
  --photo-bg:#000;           /* 사진 뒤 바탕 (사진 비율이 달라 남는 곳) */
  --top-bg:var(--brand);     /* 맨 위 매장 이름 띠 */
  --top-ink:var(--on-brand);
  --top-line:none;           /* 띠 아래 선 (border 값) */
  --top-shadow:0 .2rem .8rem rgba(0,0,0,.35);
  --top-align:flex-start;    /* 매장 이름 위치: flex-start(왼쪽) · center */
  --title-bg:var(--brand);   /* 구역 제목 띠 */
  --title-ink:var(--on-brand);
  --title-radius:0 2em 2em 0;
  --title-shadow:-.35em 0 0 rgba(255,255,255,.85);
  --badge-new-bg:#fff; --badge-new-ink:var(--brand);
  --badge-best-bg:#ffc928; --badge-best-ink:#2a1d00;
  --hot:#ff8a65; --ice:#7cc7ff; /* 가격 이름표 HOT·ICE 색 */
  --sold-bg:#000; --sold-ink:#fff; --sold-line:rgba(255,255,255,.8);
  --caption-bg:linear-gradient(transparent,rgba(0,0,0,.85)); --caption-ink:#fff; /* 목록형 큰 사진 위 이름 */
  --promo-shadow:0 .1em .6em rgba(0,0,0,.6); /* 홍보 문구 그림자 */
  --band-bg:rgba(0,0,0,.82); /* 번호 띠 */
  --band-ink:#fff; --band-muted:rgba(255,255,255,.72);
  --band-line:var(--brand);
  --call-bg:var(--brand);    /* 가장 최근 번호 강조 (번호 띠·번호 전용 화면) */
  --call-ink:var(--on-brand);
  /* ── 테마 값 끝 ── */

  --pad:1.6rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(1.5vmax * var(--zoom, 1));background:var(--base)}
body{position:relative;z-index:0;height:100vh;overflow:hidden;cursor:none;display:flex;flex-direction:column;
  color:var(--ink);background:var(--base);
  font-family:var(--font);
  font-weight:var(--weight);line-height:1.2;word-break:keep-all;overflow-wrap:break-word}

/* 배경: 매장 배경 이미지 위에 막(--veil)과 빛(--glow). 이미지가 없으면 바탕색에 빛만.
   배경을 img로 그려서, board.js가 사진이 다 뜬 뒤 화면을 저장할 때 배경도 기다린다. */
#bg{position:absolute;top:0;left:0;z-index:-2;width:100%;height:100%;object-fit:cover}
body::before,body::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:-1}
body::before{background:var(--veil)}
body::after{background:var(--glow);opacity:var(--glow-opacity)}

/* 맨 위 매장 이름 띠 (메뉴 화면만) */
#top{flex:none;display:flex;align-items:center;justify-content:var(--top-align);padding:.7rem var(--pad);
  background:var(--top-bg);color:var(--top-ink);border-bottom:var(--top-line);box-shadow:var(--top-shadow)}
#top h1{font-size:1.6rem;letter-spacing:.02em}
#top[hidden]{display:none}

/* 화면 본문: 번호 띠가 붙으면 그만큼 줄어든다 (flex:1; min-height:0) */
#main{--fit:1;flex:1;min-height:0;display:flex;gap:.9em;padding:.9em var(--pad) 1em;
  font-size:calc(1rem * var(--fit))}

/* 구역 제목: 브랜드 색 띠 */
.band-title{flex:none;align-self:flex-start;padding:.25em 1.2em .25em .9em;font-size:1.3em;
  background:var(--title-bg);color:var(--title-ink);border-radius:var(--title-radius);box-shadow:var(--title-shadow)}

/* 딱지, 가격, 품절 */
.badge{display:inline-block;padding:.12em .5em;border-radius:.4em;font-size:.72em;letter-spacing:.04em;
  vertical-align:.25em;margin-left:.45em;background:var(--badge-new-bg);color:var(--badge-new-ink);white-space:nowrap}
.badge.best{background:var(--badge-best-bg);color:var(--badge-best-ink)}
.prices{display:flex;flex-wrap:wrap;gap:.15em .8em;align-items:baseline;white-space:nowrap}
.price{font-size:1.2em;font-variant-numeric:tabular-nums}
.price small{font-size:.58em;padding:.06em .35em;margin-right:.3em;border:.07em solid var(--muted);
  border-radius:.3em;color:var(--muted);vertical-align:.2em}
.price.hot small{border-color:var(--hot);color:var(--hot)}
.price.ice small{border-color:var(--ice);color:var(--ice)}
.sold{opacity:.4;filter:grayscale(1)}
.soldtag{display:inline-block;padding:.12em .55em;border-radius:.4em;font-size:.85em;background:var(--sold-bg);
  color:var(--sold-ink);border:.07em solid var(--sold-line);white-space:nowrap}

/* ── 사진 격자형 ── 가로: 구역을 옆으로(너비는 칸 수만큼), 세로: 구역을 아래로(높이는 줄 수만큼) */
.grid{flex:1;min-width:0;min-height:0;display:flex;gap:1.2em}
.grid section{min-width:0;min-height:0;display:flex;flex-direction:column;gap:.6em}
.cards{flex:1;min-height:0;display:grid;gap:.8em;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr))}
.card{position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border-radius:var(--radius);border:var(--card-border);box-shadow:var(--card-shadow)}
.card img{flex:1;min-height:0;width:100%;object-fit:cover;background:var(--photo-bg)} /* 글 줄을 다 보여주고 남는 높이만큼 사진 */
.card .txt{flex:none;padding:.55em .8em .65em;display:flex;flex-direction:column;gap:.25em}
.card .name{font-size:1.3em}
.card .badge{position:absolute;top:.6em;left:.6em;margin:0;font-size:.9em;box-shadow:0 .1em .4em rgba(0,0,0,.4)}
.card .soldtag{position:absolute;top:.6em;right:.6em}
.card .txt .soldtag{position:static;align-self:flex-start}

/* ── 목록 + 큰 사진형 ── 가로: 왼쪽 목록(최대 10줄) + 오른쪽 큰 사진 2~3장, 세로: 목록 아래 사진 */
.list{flex:1.3 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.35em;
  padding:.9em 1.2em;background:var(--panel);border-radius:var(--radius);border:var(--card-border);box-shadow:var(--card-shadow)}
.list section{display:flex;flex-direction:column}
.list section + section{margin-top:.6em}
.list .band-title{margin-bottom:.25em}
.row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.1em .8em;
  padding:.38em .2em;border-bottom:.06em dashed var(--line)}
.row:last-child{border-bottom:0}
.row .name{flex:1 0 auto;max-width:100%;font-size:1.3em}
.row .prices{flex:0 0 auto;margin-left:auto}
.photos{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.8em}
.photo{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--radius);background:var(--photo-bg);
  border:var(--card-border);box-shadow:var(--card-shadow)}
.photo img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:1.4em .9em .6em;font-size:1.2em;
  background:var(--caption-bg);color:var(--caption-ink)}

/* ── 홍보 화면 ── 이미지 한 장 + 문구 최대 두 줄 */
.promo{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.6em}
.promo img{flex:1;min-height:0;width:100%;object-fit:contain} /* 사진 높이를 vh로 고정하지 않는다 (4K에서 글이 밀려남) */
.promo .lines{flex:none;text-align:center;padding:.2em 1em .3em}
.promo .lines p{font-size:2.8em;line-height:1.25;text-shadow:var(--promo-shadow)}
.promo .lines p + p{font-size:1.9em;color:var(--muted);margin-top:.2em}
.promo.noimg{justify-content:center}
.promo.noimg .lines p{font-size:4.4em}
.promo.noimg .lines p + p{font-size:2.6em}

/* ── 번호 전용 화면 ── 가로: 왼쪽 큰 번호 + 오른쪽 앞 번호들, 세로: 위아래 */
.calls{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;gap:2.5em;text-align:center}
.calls .now-box{display:flex;flex-direction:column;align-items:center;gap:.7em}
.calls h2{font-size:2.2em}
.calls .hint{font-size:1.3em;color:var(--muted)}
.calls .now{font-size:12em;line-height:1;padding:.12em .3em;border-radius:.16em;background:var(--call-bg);color:var(--call-ink);
  font-variant-numeric:tabular-nums;box-shadow:0 .03em .15em rgba(0,0,0,.45)}
.calls .prev-box{display:flex;flex-direction:column;align-items:center;gap:.7em}
.calls .prev{font-size:1.3em;color:var(--muted)}
.calls .rest{display:grid;grid-template-columns:repeat(2,auto);gap:.6em}
.calls .rest span{font-size:3.2em;padding:.1em .45em;border-radius:.3em;background:var(--panel);
  border:.03em solid var(--line);box-shadow:var(--card-shadow);font-variant-numeric:tabular-nums}
.calls.empty{flex-direction:column;gap:1em}
.calls.empty h2{font-size:4em}
.calls.empty .hint{font-size:1.8em}

/* ── 번호 띠 ── 메뉴·홍보 화면 아래, 가장 최근 번호를 강조색. 들어가는 만큼만 보인다 */
#band{flex:none;display:flex;align-items:center;gap:1.1rem;padding:.6rem var(--pad);color:var(--band-ink);
  background:var(--band-bg);border-top:.22rem solid var(--band-line);white-space:nowrap;overflow:hidden}
#band[hidden]{display:none}
#band .label{font-size:1.15rem;color:var(--band-muted)}
#band span{font-size:2.1rem;font-variant-numeric:tabular-nums}
#band .now{padding:.05rem .9rem;border-radius:.5rem;background:var(--call-bg);color:var(--call-ink);font-size:2.5rem}
#band .none{font-size:1.25rem;color:var(--band-muted)}

/* 새 번호가 불리면 깜빡임 (이전에 그린 첫 번호와 다를 때만) */
@keyframes flash{0%,100%{transform:scale(1);filter:none}20%,60%{transform:scale(1.08);filter:brightness(1.6)}40%,80%{transform:scale(1);filter:none}}
.flash{animation:flash 2.4s ease-in-out}

.notice{margin:auto;font-size:2em;color:var(--muted);text-align:center}

/* ── 세로로 건 화면: 옆이 아니라 아래로 쌓는다 ── */
@media (orientation:portrait){
  .grid{flex-direction:column}
  #main{flex-direction:column}
  .list{flex:0 1 auto}
  .photos{flex-direction:row}
  .calls{flex-direction:column;gap:3em}
  .calls .rest{grid-template-columns:repeat(2,auto)}
  .calls .now{font-size:13em}
  .calls .rest span{font-size:3.6em}
}
</style>
<script>
// 테마: themes/<이름>.css를 기본 스타일 뒤에 붙인다. 이름은 주소의 &theme= (미리 보기·시험용)가 먼저,
// 없으면 매장 데이터의 store.theme(계약 추가 제안, 아직 서버에 없음), 둘 다 없으면 테마 없이 기본 모습.
// 파일이 없거나 못 읽으면 기본 모습으로 둔다. 테마가 늦게 뜨면 글자 크기 맞춤(fit)을 다시 한다.
var URL_THEME = new URLSearchParams(location.search).get('theme') || ''
function setTheme(name) {
  name = /^[a-z0-9-]{1,32}$/.test(name || '') ? name : ''
  var link = document.getElementById('theme')
  if ((link ? link.getAttribute('data-name') : '') === name) return
  if (link) link.parentNode.removeChild(link)
  document.documentElement.removeAttribute('data-theme')
  if (!name) return refit()
  link = document.createElement('link')
  link.id = 'theme'
  link.rel = 'stylesheet'
  link.setAttribute('data-name', name)
  link.onload = function () { document.documentElement.setAttribute('data-theme', name); refit() }
  link.onerror = function () { if (link.parentNode) link.parentNode.removeChild(link); refit() }
  link.href = 'themes/' + name + '.css'
  document.head.appendChild(link)
}
function refit() { var m = document.getElementById('main'); if (m && window.fit && m.childElementCount) fit(m) }
setTheme(URL_THEME)
</script>

<img id="bg" alt="" hidden>
<header id="top"><h1 id="store"></h1></header>
<main id="main"></main>
<footer id="band" hidden></footer>

<script>
var MAX_GRID = 8   // 사진 격자형: 화면당 메뉴 최대 8개 (사진 없는 메뉴는 넣지 않는다)
var MAX_ROWS = 10  // 목록형: 목록 최대 10줄
var MAX_PHOTOS = 3 // 목록형: 큰 사진 최대 3장
var MAX_PREV = 8   // 번호 전용 화면: 가장 최근 번호 말고 작게 보이는 앞 번호
var BAND_COUNT = 6 // 번호 띠: 최대 이만큼, 화면 너비에 들어가는 만큼만
var MIN_FIT = 0.6  // 넘칠 때 글자를 줄이는 한계
var lastFirstCall  // 이전에 그린 가장 최근 번호(와 부른 시각). 다를 때만 깜빡인다

function el(tag, text, cls) {
  var node = document.createElement(tag)
  if (text != null && text !== '') node.textContent = text // 사람이 입력한 글은 textContent로만 넣는다
  if (cls) node.className = cls
  return node
}

function img(src) {
  var node = el('img')
  node.alt = ''
  node.src = src // 원본 그대로 쓰고 object-fit으로 맞춘다 (4K에서도 흐려지지 않게)
  return node
}

// 브랜드 색 위 글자색: 흰색과 검은색 중 대비가 큰 쪽 (사장님이 노랑 같은 밝은 색을 골라도 글이 보이게)
function onColor(hex) {
  var m = /^#?([0-9a-f]{6}|[0-9a-f]{3})$/i.exec(String(hex).trim())
  if (!m) return '#fff'
  if (m[1].length === 3) m[1] = m[1].replace(/./g, '$&$&') // #fd0 → #ffdd00
  var lum = [0, 2, 4].map(function (i) {
    var c = parseInt(m[1].substr(i, 2), 16) / 255
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
  })
  var L = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2]
  return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.05) ? '#fff' : '#111'
}

function won(n) { return Number(n).toLocaleString('ko-KR') }

function priceBox(item) {
  if (item.soldOut) return el('span', '품절', 'soldtag')
  var box = el('div', '', 'prices')
  item.prices.forEach(function (p) {
    var label = p.label ? String(p.label) : ''
    var cls = 'price' + (/^hot$/i.test(label) ? ' hot' : /^ice$/i.test(label) ? ' ice' : '')
    var span = box.appendChild(el('span', '', cls))
    if (label) span.appendChild(el('small', label))
    span.appendChild(document.createTextNode(won(p.amount)))
  })
  return box
}

function badge(item) {
  if (item.badge === 'new') return el('span', 'NEW', 'badge new')
  if (item.badge === 'best') return el('span', 'BEST', 'badge best')
  return null
}

function portrait() { return window.innerHeight > window.innerWidth }

// 화면에 고른 구역을 구역 순서대로, 각 구역의 메뉴를 order 순서로. 앞에서부터 max개까지만.
function groups(board, screen, max, filter) {
  var ids = screen.sectionIds || []
  var left = max
  return board.sections
    .filter(function (s) { return ids.indexOf(s.id) >= 0 })
    .sort(function (a, b) { return a.order - b.order })
    .map(function (s) {
      var items = board.items
        .filter(function (m) { return m.sectionId === s.id && (!filter || filter(m)) })
        .sort(function (a, b) { return a.order - b.order })
        .slice(0, Math.max(left, 0))
      left -= items.length
      return { section: s, items: items }
    })
    .filter(function (g) { return g.items.length })
}

function drawGrid(main, board, screen) {
  var gs = groups(board, screen, MAX_GRID, function (m) { return !!m.photoUrl })
  if (!gs.length) return storeOnly(main, board)
  var total = gs.reduce(function (n, g) { return n + g.items.length }, 0)
  var vertical = portrait()
  // 가로: 모든 구역이 같은 줄 수(메뉴 4개 이하면 1줄, 아니면 2줄)를 쓰고, 구역 너비는 칸 수만큼
  // 세로: 모든 구역이 2칸을 쓰고, 구역 높이는 줄 수만큼
  var rowsAll = total <= 4 ? 1 : 2
  var wrap = main.appendChild(el('div', '', 'grid'))
  gs.forEach(function (g) {
    var n = g.items.length
    var cols = vertical ? Math.min(2, total <= 2 ? 1 : 2) : Math.ceil(n / rowsAll)
    var rows = vertical ? Math.ceil(n / cols) : rowsAll
    var sec = wrap.appendChild(el('section'))
    sec.style.flex = (vertical ? rows : cols) + ' 1 0'
    sec.appendChild(el('h2', g.section.name, 'band-title'))
    var cards = sec.appendChild(el('div', '', 'cards'))
    cards.style.setProperty('--cols', cols)
    cards.style.setProperty('--rows', rows)
    g.items.forEach(function (m) {
      var card = cards.appendChild(el('article', '', 'card' + (m.soldOut ? ' sold' : '')))
      card.appendChild(img(m.photoUrl))
      var b = badge(m)
      if (b) card.appendChild(b)
      var txt = card.appendChild(el('div', '', 'txt'))
      txt.appendChild(el('div', m.name, 'name'))
      txt.appendChild(priceBox(m))
    })
  })
}

function drawList(main, board, screen) {
  var gs = groups(board, screen, MAX_ROWS)
  if (!gs.length) return storeOnly(main, board)
  var list = main.appendChild(el('div', '', 'list'))
  var shown = []
  gs.forEach(function (g) {
    var sec = list.appendChild(el('section'))
    sec.appendChild(el('h2', g.section.name, 'band-title'))
    g.items.forEach(function (m) {
      shown.push(m)
      var row = sec.appendChild(el('div', '', 'row' + (m.soldOut ? ' sold' : '')))
      var name = row.appendChild(el('span', m.name, 'name'))
      var b = badge(m)
      if (b) name.appendChild(b)
      row.appendChild(priceBox(m))
    })
  })
  // 큰 사진: 목록에 나온 메뉴 중 사진 있는 것. 딱지 붙은 메뉴 먼저, 품절은 빼고
  var pics = shown.filter(function (m) { return m.photoUrl && !m.soldOut })
  pics = pics.filter(function (m) { return m.badge }).concat(pics.filter(function (m) { return !m.badge })).slice(0, MAX_PHOTOS)
  if (!pics.length) return
  var photos = main.appendChild(el('div', '', 'photos'))
  pics.forEach(function (m) {
    var fig = photos.appendChild(el('figure', '', 'photo'))
    fig.appendChild(img(m.photoUrl))
    fig.appendChild(el('figcaption', m.name))
  })
}

function drawPromo(main, board, screen) {
  var lines = (screen.lines || []).filter(function (l) { return l }).slice(0, 2)
  var promo = main.appendChild(el('div', '', 'promo' + (screen.imageUrl ? '' : ' noimg')))
  if (screen.imageUrl) promo.appendChild(img(screen.imageUrl))
  if (lines.length) {
    var box = promo.appendChild(el('div', '', 'lines'))
    lines.forEach(function (l) { box.appendChild(el('p', l)) })
  }
  if (!screen.imageUrl && !lines.length) promo.appendChild(el('p', board.store.name, 'notice'))
}

// 보여 줄 것이 없는 화면: 손님 앞이므로 설정 안내 글 대신 매장 이름만
function storeOnly(main, board) {
  main.appendChild(el('p', board.store.name, 'notice'))
}

function drawCalls(main, board, fresh) {
  var calls = board.calls || []
  var box = main.appendChild(el('div', '', 'calls' + (calls.length ? '' : ' empty')))
  if (!calls.length) { // 번호가 없으면 빈 화면 대신 매장 이름과 안내
    box.appendChild(el('h2', board.store.name))
    box.appendChild(el('p', '주문하신 메뉴가 준비되면 이곳에 번호가 나옵니다.', 'hint'))
    return
  }
  var nowBox = box.appendChild(el('div', '', 'now-box'))
  nowBox.appendChild(el('h2', '준비된 번호'))
  nowBox.appendChild(el('div', String(calls[0]), 'now' + (fresh ? ' flash' : '')))
  nowBox.appendChild(el('p', '카운터에서 받아 가세요', 'hint'))
  var rest = calls.slice(1, 1 + MAX_PREV)
  if (!rest.length) return
  var prevBox = box.appendChild(el('div', '', 'prev-box'))
  prevBox.appendChild(el('p', '먼저 부른 번호', 'prev'))
  var row = prevBox.appendChild(el('div', '', 'rest'))
  rest.forEach(function (n) { row.appendChild(el('span', String(n))) })
}

function drawBand(band, board, fresh) {
  var calls = board.calls || []
  band.appendChild(el('span', '준비된 번호', 'label'))
  if (!calls.length) return band.appendChild(el('span', '지금은 부른 번호가 없습니다', 'none'))
  calls.slice(0, BAND_COUNT).forEach(function (n, i) {
    band.appendChild(el('span', String(n), i ? '' : 'now' + (fresh ? ' flash' : '')))
  })
  // 화면 너비에 들어가는 만큼만: 오래된 번호부터 뺀다 (가장 최근 번호는 남긴다)
  while (band.scrollWidth > band.clientWidth + 1 && band.children.length > 2) band.removeChild(band.lastChild)
}

// 본문이 넘치는지: 상자 밖으로 나간 내용이 있거나, 격자 카드의 사진이 카드 높이의 40%보다 작아졌으면 넘친 것
function overflowing(main) {
  var boxes = main.querySelectorAll('.list, .calls, .promo, .card .txt, .row')
  for (var i = 0; i < boxes.length; i++) {
    var b = boxes[i]
    if (b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1) return true
  }
  var cards = main.querySelectorAll('.card')
  for (var j = 0; j < cards.length; j++) {
    var pic = cards[j].querySelector('img')
    if (pic.getBoundingClientRect().height < cards[j].getBoundingClientRect().height * 0.4) return true
  }
  var photos = main.querySelectorAll('.photo') // 목록형 큰 사진이 이름 글자보다 낮게 눌렸으면 넘친 것
  for (var k = 0; k < photos.length; k++) {
    if (photos[k].clientHeight < photos[k].querySelector('figcaption').offsetHeight * 2.2) return true
  }
  return main.scrollHeight > main.clientHeight + 1 || main.scrollWidth > main.clientWidth + 1
}

// 넘치면 본문 글자를 조금씩 줄인다 (기본 크기에서는 대부분 줄이지 않는다)
function fit(main) {
  var f = 1
  main.style.setProperty('--fit', f)
  while (f > MIN_FIT && overflowing(main)) {
    f = Math.round((f - 0.05) * 100) / 100
    main.style.setProperty('--fit', f)
  }
  // 그래도 넘치고 목록형이면 큰 사진을 빼고 목록만 다시 맞춘다 (메뉴 글이 사진보다 먼저)
  var photos = main.querySelector('.photos')
  if (overflowing(main) && photos) { main.removeChild(photos); fit(main) }
}

// board: 계약 1의 데이터, screenNo: 이 TV가 띄울 화면 번호. 불릴 때마다 처음부터 다시 그린다.
function renderBoard(board, screenNo) {
  var screen = board.screens.filter(function (s) { return s.no === screenNo })[0]
  var main = document.getElementById('main')
  var band = document.getElementById('band')
  var bg = document.getElementById('bg')
  var top = document.getElementById('top')

  // 브랜드 색은 #rrggbb(또는 #rgb)만 받는다. 다른 값(url() 등)이 오면 기본 빨강 (테마의 --glow·띠에도 들어가므로)
  var brand = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(board.store.brandColor || '') ? board.store.brandColor : '#c8102e'
  document.documentElement.style.setProperty('--brand', brand)
  document.documentElement.style.setProperty('--on-brand', onColor(brand))
  setTheme(URL_THEME || board.store.theme) // store.theme은 계약 추가 제안. 아직 없으면 주소의 theme 또는 기본
  if (board.store.backgroundUrl) {
    if (bg.getAttribute('src') !== board.store.backgroundUrl) bg.src = board.store.backgroundUrl
    bg.hidden = false
  } else { bg.removeAttribute('src'); bg.hidden = true }
  document.getElementById('store').textContent = board.store.name
  document.title = board.store.name + ' 메뉴판'

  var first = board.calls && board.calls.length ? board.calls[0] + '@' + (board.lastCallAt || '') : null // 같은 번호를 다시 불러도 깜빡이게
  var fresh = lastFirstCall !== undefined && first !== null && first !== lastFirstCall
  lastFirstCall = first

  main.textContent = ''
  band.textContent = ''
  band.hidden = !(screen && screen.type !== 'calls' && screen.callBand)
  top.hidden = !screen || screen.type === 'calls' || screen.type === 'promo' // 번호·홍보 화면은 화면을 다 쓴다. 화면이 없으면 가운데 매장 이름만

  if (!band.hidden) drawBand(band, board, fresh)
  // 화면이 없거나(화면 구성에서 지움) 모르는 종류면 손님 앞에 안내 글 대신 매장 이름만 띄운다(점검표 M-6)
  if (!screen) storeOnly(main, board)
  else if (screen.type === 'grid') drawGrid(main, board, screen)
  else if (screen.type === 'list') drawList(main, board, screen)
  else if (screen.type === 'promo') drawPromo(main, board, screen)
  else if (screen.type === 'calls') drawCalls(main, board, fresh)
  else storeOnly(main, board)
  fit(main)
}
</script>
